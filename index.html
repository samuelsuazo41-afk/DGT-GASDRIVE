<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GasDrive DGT ES V8.9.1</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f0f1e; color:#fff; overflow-x:hidden; }
    .app { max-width:600px; margin:0 auto; min-height:100vh; padding-bottom:80px; }
    
    /* Header */
    .header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:20px; text-align:center; border-bottom:2px solid #ff8c00; }
    .header h1 { font-size:24px; margin-bottom:5px; }
    .coins { font-size:18px; color:#ffd700; font-weight:700; }
    
    /* Tabs contenido */
    .tab-content { display:none; padding:20px; }
    .tab-content.active { display:block; animation:fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    
    /* Temario */
    .temario-lista { display:grid; gap:12px; }
    .temario-item { background:#1a1a2e; padding:20px; border-radius:12px; cursor:pointer; border:2px solid #2a2a3e; transition:all 0.2s; }
    .temario-item:active { transform:scale(0.98); border-color:#ff8c00; }
    
    /* Test */
    .pregunta-box { background:#1a1a2e; padding:25px; border-radius:15px; margin-bottom:20px; }
    .opciones button { width:100%; padding:15px; margin:8px 0; background:#2a2a3e; border:2px solid #3a3a4e; border-radius:10px; color:#fff; font-size:16px; cursor:pointer; transition:all 0.2s; }
    .opciones button:active { transform:scale(0.98); }
    .opciones button.correcta { background:#4ade80; border-color:#22c55e; }
    .opciones button.incorrecta { background:#ef4444; border-color:#dc2626; }
    
    /* Menú abajo */
    .tabs { position:fixed; bottom:0; left:0; right:0; background:#1a1a2e; display:flex; overflow-x:auto; border-top:2px solid #2a2a3e; z-index:1000; }
    .tab-btn { flex:1; min-width:80px; padding:12px 8px; background:none; border:none; color:#999; font-size:11px; cursor:pointer; white-space:nowrap; transition:all 0.2s; }
    .tab-btn.active { color:#ff8c00; border-top:2px solid #ff8c00; }
    .tab-btn:active { background:#2a2a3e; }
    
    /* Garaje/Tienda */
    .garaje-lista, .tienda-lista, .tips-lista { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .coche-item, .accesorio-item, .emoji-item, .tip-item { background:#1a1a2e; padding:15px; border-radius:12px; text-align:center; border:2px solid #2a2a3e; }
    
    /* Animación emoji */
    @keyframes flotar { 0% { opacity:0; transform:translate(-50%,-50%) scale(0.5); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.2); } 100% { opacity:0; transform:translate(-50%,-50%) scale(0.8) translateY(-30px); } }
  </style>
</head>
<body>
  <!-- 8.9.1: Intro pantalla completa - el JS la genera con mostrarIntro() -->
  
  <div class="app">
    <!-- Header -->
    <div class="header">
      <h1>GasDrive DGT ES V8.9.1</h1>
      <div class="coins">💰 <span id="coins-display">0</span> coins</div>
    </div>

    <!-- TAB TEMARIO - 8.9.1: SIN active para que no arranque aquí -->
    <div id="tab-temario" class="tab-content">
      <h2 style="margin-bottom:20px">📚 Temarios Oficiales DGT</h2>
      <div id="temario-lista" class="temario-lista">
        <!-- Se rellena con cargarTemarioHTML() -->
      </div>
    </div>

    <!-- TAB TEST -->
    <div id="tab-test" class="tab-content">
      <div class="pregunta-box">
        <div id="test-general-imagen" style="margin-bottom:15px"></div>
        <div id="test-general-pregunta" style="font-size:18px;margin-bottom:20px;font-weight:600"></div>
        <div class="opciones" id="test-general-opciones"></div>
      </div>
    </div>

    <!-- TAB SITUACIONES -->
    <div id="tab-situaciones" class="tab-content">
      <h2 style="margin-bottom:20px">🚦 Situaciones de Tráfico</h2>
      <div id="situaciones-lista"></div>
    </div>

    <!-- TAB EXAMEN -->
    <div id="tab-examen" class="tab-content">
      <h2 style="margin-bottom:20px">📋 Examen DGT 30 preguntas</h2>
      <button onclick="iniciarExamen()" style="width:100%;padding:18px;background:linear-gradient(135deg,#ff8c00,#ff2d55);border:none;color:#fff;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer">INICIAR EXAMEN</button>
      <div id="examen-contenedor" style="margin-top:20px"></div>
    </div>

    <!-- TAB GARAJE -->
    <div id="tab-garaje" class="tab-content">
      <h2 style="margin-bottom:20px">🏎️ Garaje</h2>
      <div id="garaje-lista" class="garaje-lista"></div>
    </div>

    <!-- TAB TIENDA -->
    <div id="tab-tienda" class="tab-content">
      <h2 style="margin-bottom:20px">🛒 Tienda</h2>
      <h3 style="margin:20px 0 10px">Accesorios</h3>
      <div id="tienda-accesorios" class="tienda-lista"></div>
      <h3 style="margin:20px 0 10px">Emojis</h3>
      <div id="tienda-emojis" class="tienda-lista"></div>
    </div>

    <!-- TAB TIPS -->
    <div id="tab-tips" class="tab-content">
      <h2 style="margin-bottom:20px">💡 Tips DGT</h2>
      <div id="tips-lista" class="tips-lista"></div>
    </div>

    <!-- TAB PROGRESO -->
    <div id="tab-progreso" class="tab-content">
      <h2 style="margin-bottom:20px">📊 Tu Progreso</h2>
      <div id="progreso-stats"></div>
    </div>

    <!-- 8.9.1: MENÚ ABAJO - TODOS CON onclick -->
    <div class="tabs">
      <div class="tab-btn active" onclick="cambiarTab(event, 'temario')">📚 Temario</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'test')">📝 Test</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'situaciones')">🚦 Situaciones</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'examen')">📋 Examen</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'garaje')">🏎️ Garaje</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'tienda')">🛒 Tienda</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'tips')">💡 Tips</div>
      <div class="tab-btn" onclick="cambiarTab(event, 'progreso')">📊 Progreso</div>
    </div>
  </div>

  <!-- 8.9.1: Scripts al final -->
  <script src="app.js"></script>
</body>
</html>
